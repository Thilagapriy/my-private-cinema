<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Cinema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="login-screen">
        <div class="login-box">
            <h2>Access Required</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="checkLogin()">Enter Cinema</button>
            <p id="error-msg" style="color:red; display:none;">Invalid credentials</p>
        </div>
    </div>

    <div id="video-container" class="container" style="display:none;">
        <div class="video-wrapper">
            <video id="videoPlayer" playsinline preload="metadata" controlsList="nodownload">
    <source src="https://dl.dropboxusercontent.com/scl/fi/zaycu26p3snmgmuf501qi/1000137930.mp4?rlkey=nhhpmtgd68x3i3e3yh6rn2dak&st=ntetjz4y" type="video/mp4">
</video>
            
            <div class="video-overlay">
                <div class="overlay-controls">
                    <button class="overlay-btn" onclick="changeTime(-10)">-10s</button>
                    <button id="playPauseBtn" class="overlay-btn main-play" onclick="togglePlay()">Play</button>
                    <button class="overlay-btn" onclick="changeTime(10)">+10s</button>
                </div>
                <button class="fs-btn" onclick="toggleFullScreen()">⛶ Full Screen</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
